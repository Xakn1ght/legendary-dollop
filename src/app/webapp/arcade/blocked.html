<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>AstroByte Arcade</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body{
      margin:0;
      padding:0;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      background:#050816;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;
    }
    .card{
      background:rgba(15,23,42,0.95);
      border-radius:20px;
      padding:24px 20px;
      max-width:360px;
      text-align:center;
      border:1px solid rgba(148,163,184,0.4);
      box-shadow:0 20px 60px rgba(0,0,0,0.8);
    }
    .title{
      font-size:18px;
      font-weight:800;
      margin-bottom:8px;
    }
    .text{
      font-size:14px;
      color:rgba(226,232,240,0.8);
      line-height:1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">AstroByte Arcade</div>
    <div class="text">
      This game can only be opened from the AstroByte Telegram Mini App.<br><br>
      Please return to Telegram and start the game from the bot.
    </div>
  </div>
</body>
</html>
