<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>AstroBugz</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- self-hosted Vazirmatn for the Persian overlay strings (bridge.js i18n) -->
  <link rel="stylesheet" href="/webapp/static/fonts/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; width: 100%; overflow: hidden; background: #0b0617; }
    body {
      display: flex; flex-direction: column;
      height: 100svh;
      font-family: 'Vazirmatn', 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #f8fafc; user-select: none; touch-action: none;
    }

    /* ---- canvas fills everything below the header ---- */
    #game { order: 1; flex: 1; min-height: 0; width: 100%; display: block; }

    /* ---- header bar (built by bridge.js) ---- */
    #astro-header {
      order: -1; flex: none;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px;
      padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
      background: linear-gradient(180deg, rgba(26,11,46,0.96), rgba(11,6,23,0.85));
      border-bottom: 1px solid rgba(167,139,250,0.25);
      z-index: 50;
    }
    body.platform-android #astro-header { padding-top: calc(env(safe-area-inset-top, 0px) + 70px); }
    body.platform-ios #astro-header { padding-top: calc(env(safe-area-inset-top, 0px) + 50px); }

    .ah-label { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: rgba(248,250,252,0.55); font-weight: 700; }
    #ah-score-val { font-size: 20px; font-weight: 800; font-family: monospace; letter-spacing: 1px; }
    .ah-ctrls { display: flex; gap: 8px; }
    /* golden coin counter (appears after the first pickup) */
    #ah-coin {
      display: none; align-items: center; gap: 5px;
      padding: 5px 11px; border-radius: 99px;
      background: rgba(255,210,63,0.10); border: 1px solid rgba(255,210,63,0.4);
      font-family: monospace; font-weight: 800; font-size: 14px; color: #ffd23f;
    }
    #ah-coin.on { display: flex; animation: coinPop 0.25s ease-out; }
    @keyframes coinPop { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }
    .ah-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18);
      display: flex; align-items: center; justify-content: center; cursor: pointer; transition: .15s;
    }
    .ah-btn:active { transform: scale(0.92); }
    .ah-btn svg { width: 20px; height: 20px; fill: #fff; }

    /* ---- pause veil ---- */
    #ah-veil {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(11,6,23,0.85); backdrop-filter: blur(4px);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    }
    #ah-veil > div { font-size: 34px; font-weight: 800; letter-spacing: 2px; }
    #ah-veil button, #ah-result button {
      padding: 14px 34px; border: none; border-radius: 99px; cursor: pointer;
      font-weight: 700; font-size: 15px; color: #fff;
      background: linear-gradient(135deg, #818cf8, #c04dff);
      box-shadow: 0 8px 24px rgba(129,140,248,0.4);
    }

    /* ---- game-over result + daily-lock screen ---- */
    #ah-result, #ah-locked { position: fixed; inset: 0; z-index: 300; background: rgba(11,6,23,0.92); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; }
    #ah-locked { z-index: 290; }  /* a fresh result card stays on top of the lock */
    #ah-locked button {
      padding: 14px 34px; border: none; border-radius: 99px; cursor: pointer;
      font-weight: 700; font-size: 15px; color: #fff;
      background: linear-gradient(135deg, #818cf8, #c04dff);
      box-shadow: 0 8px 24px rgba(129,140,248,0.4);
    }
    .ah-card { width: 86%; max-width: 340px; text-align: center; padding: 30px 24px; border-radius: 24px;
      background: rgba(30,27,75,0.7); border: 1px solid rgba(167,139,250,0.3); display: flex; flex-direction: column; gap: 12px; }
    .ah-go { font-size: 14px; letter-spacing: 3px; color: #ff7ec2; font-weight: 800; }
    .ah-final { font-size: 52px; font-weight: 900; font-family: monospace; color: #fff; text-shadow: 0 0 24px rgba(192,77,255,0.6); }
    .ah-msg { font-size: 13px; color: rgba(248,250,252,0.7); margin-bottom: 6px; }
    .ah-rewards { display: flex; gap: 8px; justify-content: center; margin-bottom: 2px; }
    .ah-chip { flex: 1; padding: 12px 6px; border-radius: 14px; display: flex; flex-direction: column; gap: 3px; align-items: center; }
    .ah-chip b { font-size: 20px; font-weight: 800; line-height: 1; direction: ltr; unicode-bidi: isolate; }
    .ah-chip span { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: rgba(248,250,252,0.5); }
    .ah-chip.credits { background: rgba(255,193,7,0.10);  border: 1px solid rgba(255,193,7,0.35); }
    .ah-chip.credits b { color: #ffc107; }
    .ah-chip.stars   { background: rgba(255,126,194,0.10); border: 1px solid rgba(255,126,194,0.35); }
    .ah-chip.stars b { color: #ff7ec2; }
    .ah-chip.xp      { background: rgba(57,255,136,0.08);  border: 1px solid rgba(57,255,136,0.30); }
    .ah-chip.xp b    { color: #39ff88; }
    .ah-chip.coins   { background: rgba(255,210,63,0.10);  border: 1px solid rgba(255,210,63,0.40); }
    .ah-chip.coins b { color: #ffd23f; }
    .ah-pieces { font-size: 11px; color: rgba(248,250,252,0.5); }
    .ah-race {
      padding: 10px 12px; border-radius: 12px; font-size: 13px; color: #e2e8f0;
      background: rgba(129,140,248,0.12); border: 1px solid rgba(129,140,248,0.3);
    }
    .ah-race b { color: #a5b4fc; }
    .ah-race small { color: rgba(248,250,252,0.55); font-size: 11px; }
    #ah-result button.ghost { background: rgba(255,255,255,0.06); box-shadow: none; border: 1px solid rgba(255,255,255,0.15); }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- load order matters: config defines data, bridge defines AstroBridge, engine runs -->
  <!-- bump ?v= when you change a JS file so Telegram/browsers fetch the new one -->
  <script src="config.js?v=27"></script>
  <script src="bridge.js?v=27"></script>
  <script src="engine.js?v=27"></script>
</body>
</html>
