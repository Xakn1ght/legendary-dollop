        </button>

    <script>
    // ========== Debug Mode Toggle ==========
    // Set to true for debugging, false for production (default: false)
    const DEBUG_MODE = false;
    
    // Store original console methods
    const originalConsoleLog = console.log;
    const originalConsoleError = console.error;
    const originalConsoleWarn = console.warn;
    
    // Filter Telegram WebView logs when DEBUG_MODE is false
    const shouldFilterLog = (args) => {
      if (DEBUG_MODE) return false; // Don't filter when debugging
      // Filter out Telegram WebView logs
      const message = args.join(' ');
      return message.includes('[Telegram.WebView]');
    };
    
    // Override console.log to filter Telegram WebView logs
    console.log = function(...args) {
      if (!shouldFilterLog(args)) {
        originalConsoleLog.apply(console, args);
      }
    };
    
    // Override console.error to filter Telegram WebView logs
    console.error = function(...args) {
      if (!shouldFilterLog(args)) {
        originalConsoleError.apply(console, args);
      }
    };
    
    // Override console.warn to filter Telegram WebView logs
    console.warn = function(...args) {
      if (!shouldFilterLog(args)) {
        originalConsoleWarn.apply(console, args);
      }
    };
    
    // Debug logging helper - only logs when DEBUG_MODE is true
    const debugLog = (...args) => {
      if (DEBUG_MODE) {
        originalConsoleLog(...args);
      }
    };
    const debugError = (...args) => {
      if (DEBUG_MODE) {
        originalConsoleError(...args);
      }
    };
    const debugWarn = (...args) => {
      if (DEBUG_MODE) {
        originalConsoleWarn(...args);
      }
    };
    
    let allTickets = [], currentFilter = 'all', selectedTicket = null, messagePollingInterval = null, currentLang = 'en';
    
    // WebSocket for real-time updates
    let ws = null;
    let wsConnected = false;
    let wsReconnectAttempts = 0;
    const WS_MAX_RECONNECT = 3;

    // Outgoing message dedupe: avoids "double append" when we optimistically render
    // and then receive the same message back via WebSocket.
    const pendingLocalMessages = new Map(); // key -> { el, expiresAt }
    function _pendingKey(ticketId, text) { return String(ticketId) + '|' + String(text || ''); }

    const i18n = {
      en: {
        support: 'Support',
        helpCenter: 'Help Center',
        all: 'All',
        open: 'Open',
        closed: 'Closed',
        pending: 'Pending',
        noTickets: 'No tickets yet',
        createTicketPrompt: 'Create a ticket if you need assistance.',
        noMessages: 'No messages yet.',
        sending: 'Sending...',
        failedToLoad: 'Failed to load tickets',
        failedToSend: 'Failed to send',
        ticketCreated: 'Ticket created!',
        errorCreating: 'Error creating ticket',
        messageTooShort: 'Message must be at least 10 characters long',
        errorDeleting: 'Error deleting ticket',
        ticketDeleted: 'Ticket deleted',
        deleteConfirm: 'Delete this ticket?',
        typeMessage: 'Type a message...',
        categoryLabel: 'Category',
        selectCategory: 'Select category...',
        connection: 'Connection Issue',
        money: 'Payment & Billing',
        other: 'General / Other',
        subscriptionLabel: 'Subscription (Optional)',
        none: 'None',
        messageLabel: 'Message',
        describeIssue: 'Describe your issue...',
        createTicketBtn: 'Create Ticket',
        newTicket: 'New Ticket',
        noMessagesYet: 'No messages',
        loading: 'Loading...',
        loadingTickets: 'Loading tickets...',
        loadingMessages: 'Loading messages...',
        creatingTicket: 'Creating ticket...',
        deletingTicket: 'Deleting ticket...',
        redirecting: 'Redirecting...',
        search: 'Search...'
      },
      fa: {
        support: 'پشتیبانی',
        helpCenter: 'مرکز راهنما',
        all: 'همه',
        open: 'باز',
        closed: 'بسته',
        pending: 'در انتظار',
        noTickets: 'هنوز تیکتی ندارید',
        createTicketPrompt: 'در صورت نیاز یک تیکت ایجاد کنید.',
        noMessages: 'هنوز پیامی وجود ندارد.',
        sending: 'در حال ارسال...',
        failedToLoad: 'خطا در بارگذاری تیکت‌ها',
        failedToSend: 'ارسال نشد',
        ticketCreated: 'تیکت ایجاد شد!',
        errorCreating: 'خطا در ایجاد تیکت',
        messageTooShort: 'پیام باید حداقل ۱۰ کاراکتر باشد',
        errorDeleting: 'خطا در حذف تیکت',
        ticketDeleted: 'تیکت حذف شد',
        deleteConfirm: 'این تیکت حذف شود؟',
        typeMessage: 'پیامی بنویسید...',
        categoryLabel: 'دسته‌بندی',
        selectCategory: 'انتخاب دسته‌بندی...',
        connection: 'مشکل اتصال',
        money: 'پرداخت و مالی',
        other: 'سایر',
        subscriptionLabel: 'اشتراک (اختیاری)',
        none: 'هیچ‌کدام',
        messageLabel: 'پیام',
        describeIssue: 'مشکل خود را شرح دهید...',
        createTicketBtn: 'ایجاد تیکت',
        newTicket: 'تیکت جدید',
        noMessagesYet: 'بدون پیام',
        loading: 'در حال بارگذاری...',
        loadingTickets: 'در حال بارگذاری تیکت‌ها...',
        loadingMessages: 'در حال بارگذاری پیام‌ها...',
        creatingTicket: 'در حال ایجاد تیکت...',
        deletingTicket: 'در حال حذف تیکت...',
        redirecting: 'در حال انتقال...',
        search: 'جستجو...'
      }
    };
    const t = (key) => (i18n[currentLang] && i18n[currentLang][key]) || i18n.en[key] || key;

    function localizeValidationError(res) {
      // Backend returns: { ok:false, error:'validation_error', message:'Invalid input data', details:[{field,message,type}] }
      if (!res || res.error !== 'validation_error' || !Array.isArray(res.details) || res.details.length === 0) return null;

      const first = res.details[0] || {};
      const field = String(first.field || '');
      const msg = String(first.message || '');

      // Localize common cases
      if (field === 'message' && /at least 10 characters/i.test(msg)) {
        return t('messageTooShort');
      }
      if (field === 'message' && /cannot be empty/i.test(msg)) {
        return currentLang === 'fa' ? 'پیام نمی‌تواند خالی باشد' : 'Message cannot be empty';
      }
      if (field === 'category' && /Field required/i.test(msg)) {
        return currentLang === 'fa' ? 'لطفاً دسته‌بندی را انتخاب کنید' : 'Please select a category';
      }

      // Fallback: show backend message (safe: it is our own validation message)
      return msg || null;
    }
    
    function showLoading(text) {
      const overlay = document.getElementById('loadingOverlay');
      const textEl = document.getElementById('loadingText');
      if(textEl) textEl.textContent = text || t('loading');
      if(overlay) overlay.classList.add('active');
    }
    
    function hideLoading() {
      const overlay = document.getElementById('loadingOverlay');
      if(overlay) overlay.classList.remove('active');
    }
    
    function showSkeletonTickets() {
      const list = document.getElementById('ticketsList');
      list.innerHTML = Array(3).fill(0).map(() => `
        <div class="skeleton-card">
          <div class="skeleton-header">
            <div class="skeleton skeleton-badge"></div>
            <div class="skeleton skeleton-status"></div>
          </div>
          <div class="skeleton skeleton-line w-50 h-16"></div>
          <div class="skeleton skeleton-line w-100"></div>
          <div class="skeleton skeleton-line w-70"></div>
          <div style="display:flex; justify-content:space-between; margin-top:12px;">
            <div class="skeleton skeleton-line w-30 h-8" style="margin:0;"></div>
            <div class="skeleton skeleton-line w-30 h-8" style="margin:0;"></div>
          </div>
        </div>
      `).join('');
    }
    
    function showSkeletonMessages() {
      const container = document.getElementById('messagesArea');
      container.innerHTML = `
        <div class="skeleton-message">
          <div class="skeleton skeleton-avatar"></div>
          <div class="skeleton skeleton-bubble" style="height:60px;"></div>
        </div>
        <div class="skeleton-message right">
          <div class="skeleton skeleton-avatar"></div>
          <div class="skeleton skeleton-bubble" style="height:40px;"></div>
        </div>
        <div class="skeleton-message">
          <div class="skeleton skeleton-avatar"></div>
          <div class="skeleton skeleton-bubble" style="height:80px;"></div>
        </div>
      `;
    }
    
    document.addEventListener('DOMContentLoaded', () => {
      detectPlatform();
      initLanguageSupport();
      applyTranslationsSupport();
      initializeSupportPage();
      setupKeyboardHandling();
      initSupportDesignedPickers();

      // Swipe-back gesture: smart back — closes chat if open, else goes home.
      try {
        if (window.AstroUI && window.AstroUI.swipeBack) {
          window.AstroUI.swipeBack.setup({
            edgeZone: 16, threshold: 80,
            onBack: function () {
              var chatView = document.getElementById('chatView');
              if (chatView && chatView.classList.contains('active')) {
                closeChat();
              } else {
                try { document.querySelector('.content').style.visibility = 'hidden'; } catch(_) {}
                goBackHome();
              }
            },
            canSwipe: function () { return true; },
            target: function () {
              var chatView = document.getElementById('chatView');
              if (chatView && chatView.classList.contains('active')) return chatView;
              return document.querySelector('.content');
            }
          });
        }
      } catch (_) {}
    });

    function initLanguageSupport(){
      const saved = localStorage.getItem('lang');
      let guess = 'en';
      try{
        const lc = window.Telegram?.WebApp?.initDataUnsafe?.user?.language_code;
        if (lc && /^fa/i.test(lc)) guess = 'fa';
      }catch(_){}
      currentLang = saved || guess;
      applyLanguage(currentLang);
      window.addEventListener('storage', (e) => {
        if(e.key === 'lang' && e.newValue) {
          currentLang = e.newValue;
          applyLanguage(currentLang);
          applyTranslationsSupport();
          syncSupportPickerTexts();
          renderTickets(); // Re-render with new language
        }
      });
    }
    
    function applyLanguage(lang) {
      currentLang = lang;
      document.documentElement.setAttribute('dir', lang === 'fa' ? 'rtl' : 'ltr');
      document.documentElement.setAttribute('lang', lang);
    }
    
    // ========== Aggressive Keyboard Keep-Open System ==========
    let preventBlurUntil = 0;
    let isSending = false;
    
    function keepKeyboardOpen() {
      const inputEl = document.getElementById('replyInput');
      if (inputEl) {
        inputEl.focus();
        requestAnimationFrame(() => inputEl.focus());
        setTimeout(() => inputEl.focus(), 0);
        setTimeout(() => inputEl.focus(), 10);
        setTimeout(() => inputEl.focus(), 50);
        setTimeout(() => inputEl.focus(), 100);
      }
    }
    
    function dismissKeyboard() {
      preventBlurUntil = 0;
      const inputEl = document.getElementById('replyInput');
      if (inputEl) inputEl.blur();
      if (document.activeElement) document.activeElement.blur();
      if (window.Telegram?.WebApp?.HapticFeedback) {
        window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
      }
    }
    
    // Detect if device is a phone (not tablet or desktop)
    function isPhoneDevice() {
      const hasTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
      const isSmallScreen = window.innerWidth <= 480;
      const isMobileUserAgent = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      // Exclude tablets (iPad, Android tablets typically have width > 480px)
      const isTablet = window.innerWidth > 480 && window.innerWidth <= 768 && hasTouch;
      return hasTouch && isSmallScreen && isMobileUserAgent && !isTablet;
    }
    
    function setupKeyboardHandling() {
      const replyInput = document.getElementById('replyInput');
      const sendBtn = document.getElementById('sendBtn');
      const dismissBtn = document.getElementById('keyboardDismissBtn');
      const ticketsList = document.getElementById('ticketsList');
      
      // Only show keyboard dismiss button on phone devices
      if (dismissBtn) {
        if (isPhoneDevice()) {
          dismissBtn.style.display = 'flex';
        } else {
          dismissBtn.style.display = 'none';
        }
        
        // Update on resize (in case of orientation change)
        let resizeTimeout;
        window.addEventListener('resize', () => {
          clearTimeout(resizeTimeout);
          resizeTimeout = setTimeout(() => {
            if (isPhoneDevice()) {
              dismissBtn.style.display = 'flex';
            } else {
              dismissBtn.style.display = 'none';
            }
          }, 100);
        });
      }
      
      // Enter key creates new line, not send
      if(replyInput) {
        replyInput.addEventListener('keydown', (e) => {
          if(e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            // Allow new line
            const start = replyInput.selectionStart;
            const end = replyInput.selectionEnd;
            replyInput.value = replyInput.value.substring(0, start) + '\n' + replyInput.value.substring(end);
            replyInput.selectionStart = replyInput.selectionEnd = start + 1;
            autoResize(replyInput);
          }
        });
        
        // Prevent blur during send
        replyInput.addEventListener('blur', (e) => {
          if (Date.now() < preventBlurUntil) {
            e.preventDefault();
            setTimeout(() => replyInput.focus(), 0);
          }
        });
      }
      
      // Keyboard dismiss button
      if (dismissBtn) {
        dismissBtn.addEventListener('touchend', (e) => {
          e.preventDefault();
          e.stopPropagation();
          dismissKeyboard();
        }, { passive: false });
        
        dismissBtn.addEventListener('click', (e) => {
          e.preventDefault();
          dismissKeyboard();
        });
      }
      
      // Send button - aggressive keyboard keeping
      if (sendBtn) {
        sendBtn.addEventListener('touchstart', (e) => {
          e.preventDefault();
          preventBlurUntil = Date.now() + 2000;
          replyInput?.focus();
        }, { passive: false });
        
        sendBtn.addEventListener('touchend', (e) => {
          e.preventDefault();
          e.stopPropagation();
          sendReplyKeepKeyboard();
        }, { passive: false });
        
        sendBtn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          sendReplyKeepKeyboard();
        });
        
        sendBtn.addEventListener('mousedown', (e) => {
          e.preventDefault();
          preventBlurUntil = Date.now() + 2000;
        });
      }

      // Removed: chatMessages touch blur - keeps keyboard open while scrolling
      
      if(ticketsList) {
        ticketsList.addEventListener('touchstart', () => {
          if(document.activeElement?.tagName === 'TEXTAREA') {
            document.activeElement.blur();
          }
        }, {passive: true});
      }
      
      if(window.Telegram?.WebApp) window.Telegram.WebApp.expand();
      // Swipe gesture removed - was causing issues on iPhone
      // setupSwipeGesture();
    }
    // ========== End Keyboard System ==========

    function applyTranslationsSupport(){
      const setText = (selector, key) => {
        const el = typeof selector === 'string' ? document.querySelector(selector) : selector;
        if(el) el.textContent = t(key);
      };

      setText('#pageTitle','support');
      setText('#pageSubtitle','helpCenter');
      const tabAll = document.querySelector('.filter-tab[data-filter="all"]');
      const tabOpen = document.querySelector('.filter-tab[data-filter="open"]');
      const tabClosed = document.querySelector('.filter-tab[data-filter="closed"]');
      setText(tabAll,'all'); setText(tabOpen,'open'); setText(tabClosed,'closed');
      const emptyTitle = document.querySelector('.empty-state div:nth-child(2)');
      const emptyDesc = document.querySelector('.empty-state div:nth-child(3)');
      setText(emptyTitle,'noTickets');
      setText(emptyDesc,'createTicketPrompt');
      const replyInput = document.getElementById('replyInput');

      }

    function initSupportDesignedPickers(){
      applySupportPickerMode();
      // Keep mode in sync on resize/orientation
      let tmr;
      window.addEventListener('resize', () => {
        clearTimeout(tmr);
        tmr = setTimeout(() => applySupportPickerMode(), 80);
      });
      // ESC closes picker
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeSupportPicker();
      });

        const inp = document.getElementById('supportPickerSearch');
        if (inp) inp.addEventListener('input', () => {
          if (_supportPickerType === 'sub') renderSupportPickerList('sub');
        });
        _supportPickerSearchBound = true;

      const catSel = document.getElementById('ticketCategory');
      const subSel = document.getElementById('ticketSub');
      if (catSel) catSel.addEventListener('change', syncSupportPickerTexts);
      if (subSel) subSel.addEventListener('change', syncSupportPickerTexts);

    function applySupportPickerMode(){
      const use = shouldUseDesignedPicker();
      const catSel = document.getElementById('ticketCategory');
      const subSel = document.getElementById('ticketSub');
      const catBtn = document.getElementById('ticketCategoryBtn');
      const subBtn = document.getElementById('ticketSubBtn');
      if (use) {
        if (catSel) catSel.style.display = 'none';
        if (subSel) subSel.style.display = 'none';
        if (catBtn) catBtn.style.display = 'flex';
        if (subBtn) subBtn.style.display = 'flex';
      } else {
        if (catSel) catSel.style.display = '';
        if (subSel) subSel.style.display = '';
        if (catBtn) catBtn.style.display = 'none';
        if (subBtn) subBtn.style.display = 'none';
      }
      syncSupportPickerTexts();

    function _selectedOptionText(selectEl){
      try{
        if (!selectEl) return '';
        const idx = selectEl.selectedIndex;
        if (idx < 0) return '';
        const opt = selectEl.options[idx];
        return (opt && opt.textContent) ? opt.textContent.trim() : '';
      }catch(_){
        return '';
      }
    }

    function syncSupportPickerTexts(){
      const catSel = document.getElementById('ticketCategory');
      const subSel = document.getElementById('ticketSub');
      const catText = document.getElementById('ticketCategoryBtnText');
      const subText = document.getElementById('ticketSubBtnText');

      // Category
      if (catText) {
        const val = catSel ? String(catSel.value || '') : '';
        const txt = _selectedOptionText(catSel);
        if (!val) {
          catText.textContent = t('selectCategory');
          catText.classList.add('muted');
        } else {
          catText.textContent = txt || t(val) || val;
          catText.classList.remove('muted');
        }
      }

      // Subscription
      if (subText) {
        const val = subSel ? String(subSel.value || '') : '';
        const txt = _selectedOptionText(subSel);
        if (!val) subText.textContent = t('none');
        else subText.textContent = txt || ('#' + val);
      }
    }

    let _ssOk = null;
    function canUseSessionStorage() {
      if (_ssOk !== null) return _ssOk;
      try {
        const k = '__tma_ss_test__';
        sessionStorage.setItem(k, '1');
        sessionStorage.removeItem(k);

      }
      return _ssOk;
    }

    function getUrlAuthToken() {
      try {
        if (canUseSessionStorage()) {
          const v = sessionStorage.getItem('tma_url_auth') || '';
          if (v && String(v).length > 10) return String(v);
        }
      } catch (_) {}
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const authToken = urlParams.get('auth');
        return authToken ? String(authToken) : '';
      } catch (_) {}
      return '';
    }

    async function apiCall(endpoint, method = 'GET', body = null) {
      const authToken = getUrlAuthToken();
      const tg = window.Telegram?.WebApp;
      const initData = (tg && tg.initData && tg.initData.length > 10) ? tg.initData : '';
      const url = `/api/dashboard/${endpoint}${(!initData && authToken) ? (endpoint.includes('?') ? '&' : '?') + 'auth=' + encodeURIComponent(authToken) : ''}`;

      // Bearer session token fallback
      const SESSION_STORAGE_KEY = 'tma_bearer_token';
      let bearerToken = '';
      try { bearerToken = localStorage.getItem(SESSION_STORAGE_KEY) || ''; } catch(_){ bearerToken = ''; }
      async function loginWithInitDataOnce(){
        if (!initData) return '';
        try{
          const r = await fetch('/api/dashboard/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ init_data: initData })
          });
          const j = await r.json().catch(()=>({}));
          if (r.ok && j && j.ok && j.token) {
            bearerToken = String(j.token);
            try { localStorage.setItem(SESSION_STORAGE_KEY, bearerToken); } catch(_){}
            return bearerToken;
          }
          // Check if user is not registered (needs referral code)
          if (j && j.error === 'not_registered') {
            showNotRegisteredHelp();
            return '';
          }
        }catch(_e){}
        return '';
      }
      
      // Show message for unregistered users
      let notRegisteredHelpShown = false;
      function showNotRegisteredHelp(){
        if (notRegisteredHelpShown) return;
        notRegisteredHelpShown = true;
        const lang = localStorage.getItem('lang') || 'en';
        try{
          const overlay = document.createElement('div');
          overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:16px;';
          overlay.innerHTML = `
            <div style="width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;color:var(--lightText);text-align:center;">
              <div style="font-size:48px;margin-bottom:16px;">🔐</div>
              <div style="font-weight:800;font-size:18px;margin-bottom:12px;">${lang==='fa' ? 'کد دعوت نیاز است' : 'Referral Code Required'}</div>
              <div style="opacity:.85;font-size:14px;line-height:1.6;margin-bottom:20px;">${lang==='fa' ? 'برای استفاده از این ربات، ابتدا باید با کد دعوت ثبت‌نام کنید.' : 'You need to register with a referral code first.'}</div>
              <div style="background:rgba(var(--brandRgb),0.15);border:1px solid rgba(var(--brandRgb),0.3);padding:14px 16px;border-radius:12px;margin-bottom:16px;">
                <div style="font-family:monospace;font-size:18px;font-weight:700;color:var(--brand);">/start</div>
              </div>
              <button onclick="try{window.Telegram?.WebApp?.close();}catch(_){this.closest('div[style*=fixed]').remove();}" style="padding:12px 24px;background:var(--brand);border:none;border-radius:10px;color:#fff;font-weight:700;cursor:pointer;">${lang==='fa' ? 'بستن' : 'Close'}</button>
            </div>
          `;
          document.body.appendChild(overlay);
        }catch(_){}
      }
      
      try {
        const opts = { method, credentials: 'include' };
        // Always attach initData header when available so backend can authenticate without URL tokens
        if (initData) {
          opts.headers = Object.assign({}, opts.headers || {}, { 'X-Telegram-Init': initData });
        }
        if (bearerToken) {
          opts.headers = Object.assign({}, opts.headers || {}, { 'Authorization': 'Bearer ' + bearerToken });
        } else if (initData) {
          const t = await loginWithInitDataOnce();
          if (t) opts.headers = Object.assign({}, opts.headers || {}, { 'Authorization': 'Bearer ' + t });
        }
        if(body) {
          opts.headers = Object.assign({}, opts.headers || {}, { 'Content-Type': 'application/json' });
          opts.body = JSON.stringify(body);
        }
        let res = await fetch(url, opts);
        if ((res.status === 401 || res.status === 403) && initData) {
          try { localStorage.removeItem(SESSION_STORAGE_KEY); } catch(_){}
          bearerToken = '';
          const t2 = await loginWithInitDataOnce();
          if (t2) {
            opts.headers = Object.assign({}, opts.headers || {}, { 'Authorization': 'Bearer ' + t2 });
            res = await fetch(url, opts);
          }
        }
        return await res.json();
      } catch(e) {
        debugError('API Error:', e);
        return { ok: false, error: e.message };
      }
    }

    async function loadTickets(showSkeleton = true) {
      if(showSkeleton) showSkeletonTickets();
      const data = await apiCall('tickets');
      if(data.ok) {
        allTickets = (data.tickets || []).slice();
        // Always keep newest activity first
        allTickets.sort((a, b) => {
          const ta = new Date(a.updated_at || a.created_at || 0).getTime();
          const tb = new Date(b.updated_at || b.created_at || 0).getTime();
          return (tb || 0) - (ta || 0);
        });
        renderTickets();
      } else {
        showToast(t('failedToLoad'), 'error');
        renderTickets();
      }
    }

    function updateTicketPreviewInDOM(ticketId, patch) {
      const card = document.querySelector(`.ticket-card[data-ticket-id="${ticketId}"]`);
      if (!card) return false;
      const previewEl = card.querySelector('[data-role="preview"]');
      const dateEl = card.querySelector('[data-role="date"]');
      const statusEl = card.querySelector('.ticket-status');
      const unreadEl = card.querySelector('[data-role="unread"]');
      if (previewEl && patch.last_message != null) previewEl.textContent = patch.last_message;
      if (dateEl && (patch.updated_at || patch.created_at)) {
        const getLocale = () => currentLang === 'fa' ? 'fa-IR' : 'en-US';
        const d = new Date(patch.updated_at || patch.created_at);
        dateEl.textContent = isNaN(d.getTime()) ? '' : d.toLocaleDateString(getLocale());
      }
      if (statusEl && patch.status) {
        const st = String(patch.status);
        const stText = t(st) || st;
        statusEl.textContent = stText;
        statusEl.className = `ticket-status status-${escapeHtml(st)}`;
      }
      if (patch.unread_count != null) {
        const n = Number(patch.unread_count) || 0;
        card.classList.toggle('unread', n > 0);
        if (unreadEl) {
          unreadEl.style.display = n > 0 ? 'inline-flex' : 'none';
          unreadEl.textContent = n > 99 ? '99+' : String(n);
        }
      }
      return true;
    }

    function moveTicketCardToTop(ticketId) {
      const list = document.getElementById('ticketsList');
      if (!list) return false;
      const card = document.querySelector(`.ticket-card[data-ticket-id="${ticketId}"]`);
      if (!card) return false;
      // Only move if currently visible under active filter
      if (currentFilter !== 'all') {
        const t = allTickets.find(x => x.id === ticketId);
        if (t && t.status !== currentFilter) return false;
      }
      if (list.firstElementChild === card) return true;
      list.insertBefore(card, list.firstElementChild);
      return true;
    }

    async function openTicket(id) {
      document.getElementById('chatBackdrop').classList.add('active');
      document.getElementById('chatView').classList.add('active');
      showSkeletonMessages();
      const data = await apiCall(`tickets/${id}`);
      if(data.ok) {
        selectedTicket = data.ticket;
        document.getElementById('chatTitle').textContent = `${t('support')} #${data.ticket.user_ticket_number || data.ticket.id}`;
        const categoryText = t(data.ticket.category) || data.ticket.category;
        document.getElementById('chatStatus').textContent = categoryText.toUpperCase();
        renderMessages(data.ticket.messages);
        // Clear unread badge locally; backend also marks admin messages read in /tickets/{id}
        try {
          const idx = allTickets.findIndex(x => x.id === id);
          if (idx >= 0) {
            allTickets[idx].unread_count = 0;
            updateTicketPreviewInDOM(id, { unread_count: 0 });
          }
        } catch(_) {}
        // Use WebSocket if available, fallback to polling
        watchTicketViaWebSocket(id);
      } else {
        closeChat();
        showToast(t('failedToLoad'), 'error');
      }
    }
    
    function closeChat() {
      document.getElementById('chatView').classList.remove('active');
      document.getElementById('chatBackdrop').classList.remove('active');
      stopMessagePolling();
      unwatchTicketViaWebSocket();
      selectedTicket = null;
      // Do not force a full ticket list reload here (can cause visible blink).
    }
    
    function renderMessages(messages) {
      const container = document.getElementById('messagesArea');
      if(!messages || messages.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:var(--text-muted); margin-top:40px;">${t('noMessages')}</div>`;
        return;
      }
      
      const getLocale = () => currentLang === 'fa' ? 'fa-IR' : 'en-US';
      
      container.innerHTML = messages.map(m => {
        const time = new Date(m.created_at).toLocaleTimeString(getLocale(), {hour: '2-digit', minute:'2-digit'});
        return `
          <div class="message ${m.from_admin ? 'admin' : 'user'}">
            <div class="message-avatar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                ${m.from_admin ? '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>' : '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'}
              </svg>
            </div>
            <div style="display:flex; flex-direction:column; max-width:100%;">
              <div class="message-bubble">${escapeHtml(m.message)}</div>
              <div class="message-time">${time}</div>
            </div>
          </div>
        `;
      }).join('');
      
      container.scrollTop = container.scrollHeight;
    }
    
    async function sendReply() {
      const input = document.getElementById('replyInput');
      const sendBtn = document.getElementById('sendBtn');
      const msg = input.value.trim();
      if(!msg || !selectedTicket || isSending) return;
      if (selectedTicket.status === 'closed' || selectedTicket.status === 'archived') {
        showToast(currentLang === 'fa' ? 'این تیکت بسته شده است' : 'This ticket is closed', 'error');
        return;
      }
      
      isSending = true;
      input.value = '';
      input.style.height = 'auto';
      if(sendBtn) sendBtn.classList.add('btn-loading');
      
      const container = document.getElementById('messagesArea');
      const tempDiv = document.createElement('div');
      const pendingId = Date.now() + '-' + Math.random().toString(16).slice(2);
      tempDiv.innerHTML = `
        <div class="message user pending" data-pending-id="${escapeHtml(pendingId)}" style="opacity:0.7">
          <div class="message-avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
          <div style="display:flex; flex-direction:column; max-width:100%;">
            <div class="message-bubble">${escapeHtml(msg)}</div>
            <div class="message-time">${t('sending')}</div>
          </div>
        </div>`;
      const pendingEl = tempDiv.firstElementChild;
      container.appendChild(pendingEl);
      container.scrollTop = container.scrollHeight;
      try {
        const key = _pendingKey(selectedTicket.id, msg);
        pendingLocalMessages.set(key, { el: pendingEl, expiresAt: Date.now() + 15000 });
      } catch(_) {}
      
      const res = await apiCall(`tickets/${selectedTicket.id}/reply`, 'POST', { message: msg });
      if(sendBtn) sendBtn.classList.remove('btn-loading');
      if(res.ok) {
        // Don't refetch + full rerender (causes visible refresh). WS/poll will deliver the real timestamp.
        try {
          const getLocale = () => currentLang === 'fa' ? 'fa-IR' : 'en-US';
          const time = new Date().toLocaleTimeString(getLocale(), {hour: '2-digit', minute:'2-digit'});
          const timeEl = pendingEl.querySelector('.message-time');
          if (timeEl) timeEl.textContent = time;
          pendingEl.style.opacity = '1';
          pendingEl.classList.remove('pending');
        } catch(_) {}
        // Update ticket preview without full reload
        try {
          const nowIso = new Date().toISOString();
          updateTicketPreviewInDOM(selectedTicket.id, { last_message: msg, updated_at: nowIso });
          const tIdx = allTickets.findIndex(x => x.id === selectedTicket.id);
          if (tIdx >= 0) {
            allTickets[tIdx].last_message = msg;
            allTickets[tIdx].updated_at = nowIso;
          }
        } catch(_) {}
        if (window.Telegram?.WebApp?.HapticFeedback) {
          window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
        }
      } else {
        if (res.error === 'ticket_closed') {
          showToast(currentLang === 'fa' ? 'این تیکت بسته شده است' : 'This ticket is closed', 'error');
        } else {
          showToast(t('failedToSend'), 'error');
        }
        try {
          const timeEl = pendingEl.querySelector('.message-time');
          if (timeEl) timeEl.textContent = (res.error === 'ticket_closed') ? (currentLang === 'fa' ? 'بسته شده' : 'Closed') : t('failedToSend');
          pendingEl.style.opacity = '1';
        } catch(_) {}
        if (window.Telegram?.WebApp?.HapticFeedback) {
          window.Telegram.WebApp.HapticFeedback.notificationOccurred('error');
        }
      }
      isSending = false;
    }
    
    // Wrapper that keeps keyboard open
    async function sendReplyKeepKeyboard() {
      const input = document.getElementById('replyInput');
      preventBlurUntil = Date.now() + 2000;
      input?.focus();
      keepKeyboardOpen();
      
      await sendReply();
      
      keepKeyboardOpen();
    }

    function showCreateTicketModal() {
      document.getElementById('createTicketModal').classList.add('active');

      syncSupportPickerTexts();

    async function createTicket(e) {
      e.preventDefault();
      const cat = document.getElementById('ticketCategory').value;
      const sub = document.getElementById('ticketSub').value;
      const msg = (document.getElementById('ticketMessage').value || '').trim();
      const btn = document.querySelector('#createTicketModal button[type="submit"]');
      
      if(!cat || !msg) return;
      if(msg.length < 10) {
        showToast(t('messageTooShort'), 'error');
        return;
      }
      
      btn.classList.add('btn-loading');
      const payload = { category: cat, message: msg };
      if(sub) payload.subscription_id = parseInt(sub);
      
      const res = await apiCall('tickets', 'POST', payload);
      btn.classList.remove('btn-loading');
      if(res.ok) {
        hideCreateTicketModal();
        showToast(t('ticketCreated'), 'success');
        document.getElementById('ticketMessage').value = '';
        document.getElementById('ticketCategory').value = '';
        document.getElementById('ticketSub').value = '';
        syncSupportPickerTexts();
        // Avoid full list rerender (blink): insert new ticket card optimistically
        try {
          const nowIso = new Date().toISOString();
          const newId = Number(res.ticket_id) || 0;
          if (!newId) throw new Error('missing_ticket_id');
          
	          const newTicket = {
	            id: newId,
	            user_ticket_number: Number(res.user_ticket_number) || newId,
	            category: cat,
	            status: 'pending',
	            created_at: nowIso,
	            updated_at: nowIso,
	            last_message: msg,
            subscription_username: null
          };
          
          try {
            if (sub) {
              const opt = document.querySelector(`#ticketSub option[value="${CSS.escape(String(sub))}"]`);
              if (opt && opt.textContent && opt.textContent !== 'None') newTicket.subscription_username = opt.textContent;
            }
          } catch(_) {}
          
          allTickets = [newTicket, ...(allTickets || [])];
          
          const list = document.getElementById('ticketsList');
          const shouldShow = currentFilter === 'all' || currentFilter === newTicket.status;
          if (list && shouldShow) {
            const emptyState = list.querySelector('.empty-state');
            if (emptyState) list.innerHTML = '';
            
            const getLocale = () => currentLang === 'fa' ? 'fa-IR' : 'en-US';
            const date = new Date(nowIso).toLocaleDateString(getLocale());
            const icon = newTicket.category === 'money' ? '<path d="M12 2v20m-5-5h10M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>' : 
                         newTicket.category === 'connection' ? '<path d="M5 12.55a11 11 0 0 1 14.08 0M1.64 9.5a15 15 0 0 1 20.72 0M12 18a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/>' :
                         '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>';
            const statusText = t(newTicket.status) || newTicket.status;
            const categoryText = t(newTicket.category) || (newTicket.category || '').charAt(0).toUpperCase() + (newTicket.category || '').slice(1);
            
            const card = document.createElement('div');
            const n = Number(newTicket.unread_count || 0) || 0;
            card.className = `ticket-card ${n > 0 ? 'unread' : ''}`;
            card.setAttribute('data-ticket-id', String(newTicket.id));
            card.onclick = () => openTicket(newTicket.id);
            card.innerHTML = `
              <div class="ticket-header">
                <span class="ticket-id">#${escapeHtml(String(newTicket.user_ticket_number || newTicket.id))}</span>
                <span class="ticket-status status-${escapeHtml(newTicket.status)}">${escapeHtml(statusText)}</span>
              </div>
              <div class="ticket-category">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${icon}</svg>
                ${escapeHtml(categoryText)}
              </div>
              <div class="ticket-preview" data-role="preview">${escapeHtml(msg)}</div>
              <div class="ticket-footer">
                <span data-role="date">${escapeHtml(date)}</span>
                ${newTicket.subscription_username ? `<span>${escapeHtml(newTicket.subscription_username)}</span>` : ''}
              </div>
            `;
            list.insertBefore(card, list.firstChild);
          }
        } catch(_) {
          loadTickets();
        }
      } else {
        const localized = localizeValidationError(res);
        const errMsg = localized || res.message || t('errorCreating');
        showToast(errMsg, 'error');
      }
    }
    
    async function deleteTicket() {
      if(!selectedTicket) return;
      const ok = (window.AstroUI && window.AstroUI.confirm)
        ? await window.AstroUI.confirm({
            title: currentLang === 'fa' ? 'حذف تیکت' : 'Delete ticket',
            message: t('deleteConfirm'),
            okText: currentLang === 'fa' ? 'حذف' : 'Delete',
            cancelText: currentLang === 'fa' ? 'لغو' : 'Cancel',
            danger: true
          })
        : confirm(t('deleteConfirm'));
      if (!ok) return;
      showLoading(t('deletingTicket'));
      const res = await apiCall(`tickets/${selectedTicket.id}`, 'DELETE');
      hideLoading();
      if(res.ok) {
        showToast(t('ticketDeleted'), 'success');
        closeChat();
      } else {
        showToast(t('errorDeleting'), 'error');
      }
    }

	      const shouldPropagate = (typeof canUseSessionStorage === 'function') ? (!canUseSessionStorage()) : true;

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    function startMessagePolling() {
      // Only use polling if WebSocket is not connected
      if (wsConnected) return;
      
      if(messagePollingInterval) clearInterval(messagePollingInterval);
      messagePollingInterval = setInterval(async () => {
        if(!selectedTicket) return;
        const res = await apiCall(`tickets/${selectedTicket.id}`);
        if(res.ok && res.ticket) {
          const msgs = res.ticket.messages || [];
          const container = document.getElementById('messagesArea');
          const currentCount = container ? container.querySelectorAll('.message').length : 0;
          if (msgs.length > currentCount) {
            const shouldScroll = isChatNearBottom();
            msgs.slice(currentCount).forEach(m => {
              appendMessageToChat({ from_admin: !!m.from_admin, message: m.message, created_at: m.created_at });
            });
            if (shouldScroll && container) container.scrollTop = container.scrollHeight;
            
            // Update ticket preview/date without full reload
            try {
              const last = msgs[msgs.length - 1];
              if (last) {
                updateTicketPreviewInDOM(selectedTicket.id, { last_message: last.message || '', updated_at: last.created_at });
                const tIdx = allTickets.findIndex(x => x.id === selectedTicket.id);
                if (tIdx >= 0) {
                  allTickets[tIdx].last_message = last.message || '';
                  allTickets[tIdx].updated_at = last.created_at || allTickets[tIdx].updated_at;
                }
              }
            } catch(_) {}
          }
        }
      }, 3000);
    }
    
    function stopMessagePolling() {
      if(messagePollingInterval) clearInterval(messagePollingInterval);
      messagePollingInterval = null;
    }
    
	    // ========== WebSocket for Real-time Updates ==========
	    let wsTicketsRefreshTimer = null;
	    let ticketsPollingInterval = null;
	    function startTicketsPolling() {
	      if (ticketsPollingInterval) return;
	      try { loadTickets(false); } catch(_) {}
	      ticketsPollingInterval = setInterval(() => {
	        // Only poll list updates when WS is not connected
	        if (!wsConnected) loadTickets(false);
	      }, 5000);
	      try {
	        document.addEventListener('visibilitychange', () => {
	          try {
	            if (!document.hidden && !wsConnected) loadTickets(false);
	          } catch(_) {}
	        });
	      } catch(_) {}
	    }
	    function stopTicketsPolling() {
	      if (!ticketsPollingInterval) return;
	      clearInterval(ticketsPollingInterval);
	      ticketsPollingInterval = null;
	    }
	    function scheduleTicketsRefresh() {
	      try {
	        if (wsTicketsRefreshTimer) return;
	        wsTicketsRefreshTimer = setTimeout(async () => {
	          wsTicketsRefreshTimer = null;
	          await loadTickets(false);
	        }, 250);
	      } catch(_) {}
	    }
	    function connectWebSocket() {
	      if (ws && ws.readyState === WebSocket.OPEN) return;
	      if (wsReconnectAttempts >= WS_MAX_RECONNECT) {
	        debugLog('WebSocket: Max reconnect attempts, using polling');
	        startTicketsPolling();
	        return;
	      }
      
	      const tg = window.Telegram?.WebApp;
	      const initData = (tg && tg.initData && tg.initData.length > 10) ? tg.initData : '';
	      const authToken = (typeof getUrlAuthToken === 'function') ? getUrlAuthToken() : '';
	      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
	      const qp = new URLSearchParams();
	      if (initData) qp.set('init_data', initData);
	      else if (authToken) qp.set('auth', authToken);
	      const wsUrl = `${protocol}//${window.location.host}/api/dashboard/ws/support${qp.toString() ? ('?' + qp.toString()) : ''}`;
      
      try {
        ws = new WebSocket(wsUrl);
        
	        ws.onopen = () => {
	          debugLog('WebSocket: Connected');
	          wsConnected = true;
	          wsReconnectAttempts = 0;
	          stopTicketsPolling();
	          
	          if (selectedTicket) {
	            ws.send(JSON.stringify({ action: 'watch_ticket', ticket_id: selectedTicket.id }));
	            stopMessagePolling();
	          }
	        };
        
        ws.onmessage = async (event) => {
          try {
            const data = JSON.parse(event.data);
            
		            if (data.type === 'new_message') {
	              // Smooth path: use WS payload to update UI without full reload
	              const ticketId = data.ticket_id;
	              const payload = data.data || {};
	              const sender = payload.sender;
	              const text = payload.text || '';
	              const createdAt = payload.created_at;

	              // Update tickets list preview/date without re-render
	              const updated = updateTicketPreviewInDOM(ticketId, { last_message: text, updated_at: createdAt });
	              if (!updated) scheduleTicketsRefresh();
	              const tIdx = allTickets.findIndex(x => x.id === ticketId);
              if (tIdx >= 0) {
                allTickets[tIdx].last_message = text;
                allTickets[tIdx].updated_at = createdAt || allTickets[tIdx].updated_at;
                // Unread logic for the user: admin message while not viewing the ticket
                try {
                  if (sender === 'admin') {
                    if (!selectedTicket || ticketId !== selectedTicket.id) {
                      allTickets[tIdx].unread_count = (Number(allTickets[tIdx].unread_count) || 0) + 1;
	                      const ok = updateTicketPreviewInDOM(ticketId, { unread_count: allTickets[tIdx].unread_count });
	                      if (!ok) scheduleTicketsRefresh();
	                    } else {
	                      allTickets[tIdx].unread_count = 0;
	                      const ok = updateTicketPreviewInDOM(ticketId, { unread_count: 0 });
	                      if (!ok) scheduleTicketsRefresh();
	                    }
	                  }
	                } catch(_) {}
                // Keep newest-first ordering
                const moved = allTickets.splice(tIdx, 1)[0];
                allTickets.unshift(moved);
                moveTicketCardToTop(ticketId);
              }

              // If viewing this ticket, append message without rerender
              if (selectedTicket && ticketId === selectedTicket.id) {
                const shouldScroll = isChatNearBottom();
                // If this is an echo of our optimistic message, upgrade it instead of appending (prevents duplicates)
                let handled = false;
                try {
                  if (sender === 'user') {
                    const key = _pendingKey(ticketId, text);
                    const pending = pendingLocalMessages.get(key);
                    if (pending && pending.el && pending.expiresAt > Date.now()) {
                      const timeEl = pending.el.querySelector('.message-time');
                      if (timeEl) {
                        const getLocale = () => currentLang === 'fa' ? 'fa-IR' : 'en-US';
                        const time = createdAt ? new Date(createdAt).toLocaleTimeString(getLocale(), {hour: '2-digit', minute:'2-digit'}) : timeEl.textContent;
                        timeEl.textContent = time;
                      }
                      pending.el.style.opacity = '1';
                      pending.el.classList.remove('pending');
                      pendingLocalMessages.delete(key);
                      handled = true;
                    }
                  }
                } catch(_) {}
                if (!handled) {
                  appendMessageToChat({ from_admin: sender === 'admin', message: text, created_at: createdAt });
                }
                if (shouldScroll) {
                  const container = document.getElementById('messagesArea');
                  container.scrollTop = container.scrollHeight;
                }
              }

	              if (window.Telegram?.WebApp?.HapticFeedback) {
	                window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
	              }
	            }
		            else if (data.type === 'tickets_updated') {
		              // Ticket list changed (e.g. new ticket from another device): refresh list/badges.
		              scheduleTicketsRefresh();
		            }
		            else if (data.type === 'status_change') {
	              const ticketId = data.ticket_id;
	              const payload = data.data || {};
	              const status = payload.status;
	              const updatedAt = payload.updated_at;
              
	              // Update list card (status badge + date) without re-render
	              const ok = updateTicketPreviewInDOM(ticketId, { status, updated_at: updatedAt });
	              if (!ok) scheduleTicketsRefresh();
	              const tIdx = allTickets.findIndex(x => x.id === ticketId);
              if (tIdx >= 0) {
                allTickets[tIdx].status = status || allTickets[tIdx].status;
                allTickets[tIdx].updated_at = updatedAt || allTickets[tIdx].updated_at;
                const moved = allTickets.splice(tIdx, 1)[0];
                allTickets.unshift(moved);
                moveTicketCardToTop(ticketId);
              }
              if (selectedTicket && ticketId === selectedTicket.id) {
                selectedTicket.status = status || selectedTicket.status;
              }
            }
          } catch(e) {
            debugError('WebSocket message error', e);
          }
        };
        
	        ws.onclose = () => {
	          debugLog('WebSocket: Disconnected');
	          wsConnected = false;
	          ws = null;
	          startTicketsPolling();
	          
	          if (selectedTicket) startMessagePolling();
          
          wsReconnectAttempts++;
          if (wsReconnectAttempts < WS_MAX_RECONNECT) {
            setTimeout(connectWebSocket, 5000);
          }
        };
        
	        ws.onerror = () => {
	          debugLog('WebSocket: Error, using polling');
	          wsConnected = false;
	          startTicketsPolling();
	        };
        
	      } catch(e) {
	        debugLog('WebSocket: Failed to connect');
	        wsConnected = false;
	        startTicketsPolling();
	      }
	    }
    
    function watchTicketViaWebSocket(ticketId) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ action: 'watch_ticket', ticket_id: ticketId }));
        stopMessagePolling();
      } else {
        startMessagePolling();
      }
    }
    
    function unwatchTicketViaWebSocket() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ action: 'unwatch_ticket' }));
      }
    }
    
    async function loadTicketMessages() {
      if (!selectedTicket) return;
      const res = await apiCall(`tickets/${selectedTicket.id}`);
      if (res.ok && res.ticket) {
        renderMessages(res.ticket.messages);
      }
    }
    // ========== End WebSocket ==========
    </script>
